name: Aplicar icono CRNL a pantalla completa y compilar
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pillow
      - name: Generar iconos full bleed
        run: python aplicar_icono_full.py
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v6
        with: {gradle-version: '8.9'}
      - run: gradle --no-daemon clean assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk CRNL-Icono-Full-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CRNL-Icono-Full-APK
          path: CRNL-Icono-Full-debug.apk
