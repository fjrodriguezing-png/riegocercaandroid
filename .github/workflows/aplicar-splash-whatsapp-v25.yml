name: Aplicar Splash + WhatsApp V25 y compilar
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Aplicar y verificar ambas funciones
        run: python aplicar_splash_whatsapp_v25.py
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v6
        with: {gradle-version: '8.9'}
      - run: gradle --no-daemon clean assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk CRNL-V26-Splash-WhatsApp-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CRNL-V26-Splash-WhatsApp-APK
          path: CRNL-V26-Splash-WhatsApp-debug.apk
          if-no-files-found: error
