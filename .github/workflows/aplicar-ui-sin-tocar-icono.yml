name: Aplicar fondo y menu SIN tocar icono
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v6
   - uses: actions/setup-python@v5
     with: {python-version: '3.12'}
   - run: python aplicar_solo_fondo_menu.py
   - uses: actions/setup-java@v5
     with: {distribution: temurin, java-version: '17'}
   - uses: gradle/actions/setup-gradle@v6
     with: {gradle-version: '8.9'}
   - run: gradle --no-daemon clean assembleDebug
   - run: cp app/build/outputs/apk/debug/app-debug.apk CRNL-UI-ICONO-CONSERVADO-debug.apk
   - uses: actions/upload-artifact@v4
     with: {name: CRNL-UI-ICONO-CONSERVADO-APK, path: CRNL-UI-ICONO-CONSERVADO-debug.apk}
