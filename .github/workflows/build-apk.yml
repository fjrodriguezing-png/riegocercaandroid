name: Compilar APK Riego Cerca
on: { workflow_dispatch: {}, push: { branches: [main, master] } }
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: '8.9', cache-provider: basic }
      - run: gradle --no-daemon clean assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk RiegoCerca-debug.apk
      - uses: actions/upload-artifact@v4
        with: { name: RiegoCerca-APK, path: RiegoCerca-debug.apk, retention-days: 30 }
