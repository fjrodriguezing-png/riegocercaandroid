name: Compilar CRNL final verificada
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
 build:
  runs-on: ubuntu-latest
  timeout-minutes: 30
  steps:
   - uses: actions/checkout@v6
   - name: Verificacion PREVIA
     run: |
      grep -q 'id="splash"' app/src/main/assets/index.html
      grep -q 'grid-template-columns:repeat(2' app/src/main/assets/index.html
      grep -q 'id="aWa"' app/src/main/assets/index.html
      grep -q 'id="earthMenu"' app/src/main/assets/index.html
      grep -q '@mipmap/ic_crnl_arqueta_unico' app/src/main/AndroidManifest.xml
      test -f app/src/main/assets/splash_nova_limia.jpg
      test -f app/src/main/res/mipmap-xxxhdpi/ic_crnl_arqueta_unico.png
      echo 'PRE-GRADLE: TODAS LAS FUNCIONES CRITICAS OK'
   - uses: actions/setup-java@v5
     with: {distribution: temurin, java-version: '17'}
   - uses: gradle/actions/setup-gradle@v6
     with: {gradle-version: '8.9'}
   - run: gradle --no-daemon clean assembleDebug
   - run: cp app/build/outputs/apk/debug/app-debug.apk CRNL-FINAL-VERIFICADA-debug.apk
   - uses: actions/upload-artifact@v4
     with: {name: CRNL-FINAL-VERIFICADA-APK, path: CRNL-FINAL-VERIFICADA-debug.apk, if-no-files-found: error}
