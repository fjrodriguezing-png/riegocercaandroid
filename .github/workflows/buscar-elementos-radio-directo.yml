name: CRNL BUSCAR ELEMENTOS RADIO DIRECTO
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v6
   - uses: actions/setup-python@v5
     with: {python-version: '3.12'}
   - run: python aplicar_busqueda_radio_directa.py
   - name: Comprobar antes de Gradle
     run: |
      grep -q 'crnlRadioDirectFixV2' app/src/main/assets/index.html
      grep -q "b.textContent='BUSCANDO…'" app/src/main/assets/index.html
      grep -q 'crnl_rows' app/src/main/assets/index.html
      grep -q 'getCurrentPosition' app/src/main/assets/index.html
      echo 'BOTON RADIO DIRECTO: OK'
   - uses: actions/setup-java@v5
     with: {distribution: temurin, java-version: '17'}
   - uses: gradle/actions/setup-gradle@v6
     with: {gradle-version: '8.9'}
   - run: gradle --no-daemon clean assembleDebug
   - run: cp app/build/outputs/apk/debug/app-debug.apk CRNL-RADIO-DIRECTO-debug.apk
   - uses: actions/upload-artifact@v4
     with: {name: CRNL-RADIO-DIRECTO-APK, path: CRNL-RADIO-DIRECTO-debug.apk, if-no-files-found: error}
