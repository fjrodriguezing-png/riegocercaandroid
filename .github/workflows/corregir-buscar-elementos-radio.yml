name: Corregir BUSCAR ELEMENTOS por radio
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v6
   - uses: actions/setup-python@v5
     with: {python-version: '3.12'}
   - run: python corregir_buscar_elementos_radio.py
   - name: Verificar antes de Gradle
     run: |
      grep -q 'crnlRadioSearchFixV1' app/src/main/assets/index.html
      grep -q 'btn.onclick=runRadio' app/src/main/assets/index.html
      grep -q 'navigator.geolocation.getCurrentPosition' app/src/main/assets/index.html
      echo 'BUSQUEDA POR RADIO: OK'
   - uses: actions/setup-java@v5
     with: {distribution: temurin, java-version: '17'}
   - uses: gradle/actions/setup-gradle@v6
     with: {gradle-version: '8.9'}
   - run: gradle --no-daemon clean assembleDebug
   - run: cp app/build/outputs/apk/debug/app-debug.apk CRNL-RADIO-FIX-debug.apk
   - uses: actions/upload-artifact@v4
     with: {name: CRNL-RADIO-FIX-APK, path: CRNL-RADIO-FIX-debug.apk, if-no-files-found: error}
