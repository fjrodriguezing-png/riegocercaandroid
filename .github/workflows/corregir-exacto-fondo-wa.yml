name: Corregir EXACTO fondo y WhatsApp preservando icono
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v6
   - uses: actions/setup-python@v5
     with: {python-version: '3.12'}
   - name: Aplicar y verificar
     run: python corregir_exacto_sin_tocar_icono.py
   - uses: actions/setup-java@v5
     with: {distribution: temurin, java-version: '17'}
   - uses: gradle/actions/setup-gradle@v6
     with: {gradle-version: '8.9'}
   - run: gradle --no-daemon clean assembleDebug
   - run: cp app/build/outputs/apk/debug/app-debug.apk CRNL-FONDO-WA-EXACTO-debug.apk
   - uses: actions/upload-artifact@v4
     with: {name: CRNL-FONDO-WA-EXACTO-APK, path: CRNL-FONDO-WA-EXACTO-debug.apk}
