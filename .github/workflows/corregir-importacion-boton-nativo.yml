name: Corregir importacion con boton Android nativo
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
 build:
  runs-on: ubuntu-latest
  timeout-minutes: 30
  steps:
   - uses: actions/checkout@v6
   - uses: actions/setup-python@v5
     with: {python-version: '3.12'}
   - name: Corregir importacion y comprobar
     run: python corregir_boton_importar.py
   - name: Verificacion PREVIA a Gradle
     run: |
      grep -q 'id="importBtn"' app/src/main/assets/index.html
      grep -q 'AndroidImport.importFile' app/src/main/assets/index.html
      grep -q 'receiveImportedRows' app/src/main/assets/index.html
      grep -q 'new ImportBridge' app/src/main/java/es/riegocerca/maps/MainActivity.java
      grep -q 'NativeTabularImporter' app/src/main/java/es/riegocerca/maps/MainActivity.java
      echo 'IMPORTACION: FLUJO NATIVO COMPLETO OK'
   - uses: actions/setup-java@v5
     with: {distribution: temurin, java-version: '17'}
   - uses: gradle/actions/setup-gradle@v6
     with: {gradle-version: '8.9'}
   - run: gradle --no-daemon clean assembleDebug
   - run: cp app/build/outputs/apk/debug/app-debug.apk CRNL-IMPORT-NATIVO-debug.apk
   - uses: actions/upload-artifact@v4
     with: {name: CRNL-IMPORT-NATIVO-APK, path: CRNL-IMPORT-NATIVO-debug.apk, if-no-files-found: error}
