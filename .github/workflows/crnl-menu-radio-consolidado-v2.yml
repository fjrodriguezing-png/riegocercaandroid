name: CRNL menu radio consolidado V2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar cambios consolidados V2
        run: python corregir_radio_iconos_volver_v2.py
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK limpio
        run: gradle --no-daemon clean assembleDebug
      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CRNL-CONSOLIDADO-V2-debug.apk
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CRNL-CONSOLIDADO-V2-APK
          path: CRNL-CONSOLIDADO-V2-debug.apk
