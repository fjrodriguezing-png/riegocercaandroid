name: CRNL XLSX + RADIO UNIFICADO
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
 build:
  runs-on: ubuntu-latest
  timeout-minutes: 30
  steps:
   - uses: actions/checkout@v6
   - uses: actions/setup-python@v5
     with: {python-version: '3.12'}
   - run: python aplicar_xlsx_radio_unificado.py
   - name: VERIFICAR antes de Gradle
     run: |
      grep -q 'ByteArrayInputStream(so.toByteArray())' app/src/main/java/es/riegocerca/maps/XlsxStreamingImporter.java
      grep -q 'receiveXlsxRows' app/src/main/assets/index.html
      grep -q 'crnlXlsxRadioUnifiedV1' app/src/main/assets/index.html
      grep -q "localStorage.getItem('crnl_rows')" app/src/main/assets/index.html
      echo 'OK: XLSX Y RADIO CONECTADOS EN LA MISMA VERSION'
   - uses: actions/setup-java@v5
     with: {distribution: temurin, java-version: '17'}
   - uses: gradle/actions/setup-gradle@v6
     with: {gradle-version: '8.9'}
   - run: gradle --no-daemon clean assembleDebug
   - run: cp app/build/outputs/apk/debug/app-debug.apk CRNL-XLSX-RADIO-UNIFICADO-debug.apk
   - uses: actions/upload-artifact@v4
     with: {name: CRNL-XLSX-RADIO-UNIFICADO-APK, path: CRNL-XLSX-RADIO-UNIFICADO-debug.apk, if-no-files-found: error}
