name: Fijar fondo + menu cuadricula SIN tocar icono
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Aplicar fix visual exacto
        run: python fijar_fondo_y_menu_sin_tocar_icono.py
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v6
        with: {gradle-version: '8.9'}
      - run: gradle --no-daemon clean assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk CRNL-VISUAL-FIX-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CRNL-VISUAL-FIX-APK
          path: CRNL-VISUAL-FIX-debug.apk
          if-no-files-found: error
