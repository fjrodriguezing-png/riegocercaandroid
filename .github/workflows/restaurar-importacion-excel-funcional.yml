name: Restaurar importacion Excel funcional

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restaurar importacion Excel anterior
        run: python restaurar_importacion_excel_funcional.py
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle --no-daemon clean assembleDebug
      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CRNL-EXCEL-RESTAURADO-debug.apk
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CRNL-EXCEL-RESTAURADO-APK
          path: CRNL-EXCEL-RESTAURADO-debug.apk
