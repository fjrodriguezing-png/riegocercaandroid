name: CRNL VOLVER AL MENU TRAS IMPORTAR XLSX
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v6
   - uses: actions/setup-python@v5
     with: {python-version: '3.12'}
   - run: python aplicar_volver_menu_tras_xlsx.py
   - name: Verificar antes de Gradle
     run: |
      grep -q 'crnlReturnToOpenMenuAfterImport' app/src/main/assets/index.html
      grep -q 'receiveXlsxRows' app/src/main/assets/index.html
      echo 'OK: importacion XLSX vuelve al menu abierto'
   - uses: actions/setup-java@v5
     with: {distribution: temurin, java-version: '17'}
   - uses: gradle/actions/setup-gradle@v6
     with: {gradle-version: '8.9'}
   - run: gradle --no-daemon clean assembleDebug
   - run: cp app/build/outputs/apk/debug/app-debug.apk CRNL-XLSX-MENU-ABIERTO-debug.apk
   - uses: actions/upload-artifact@v4
     with: {name: CRNL-XLSX-MENU-ABIERTO-APK, path: CRNL-XLSX-MENU-ABIERTO-debug.apk, if-no-files-found: error}
