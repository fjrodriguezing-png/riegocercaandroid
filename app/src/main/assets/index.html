<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riego Cerca</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f3f7fa;color:#142738}main{max-width:760px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#087f5b,#187bcd);padding:22px;border-radius:24px;color:white}.card{background:white;margin-top:14px;padding:17px;border-radius:20px;box-shadow:0 8px 25px #1232}button,input,select,a{width:100%;padding:14px;border-radius:13px;border:1px solid #dbe5ec;margin-top:9px;font:inherit}button,.go{background:#087f5b;color:white;font-weight:800;text-align:center;text-decoration:none;display:block}.item{background:#f7fafc;padding:12px;border-radius:12px;margin-top:7px}</style><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head><body><main><section class="hero"><h1>Riego Cerca · Maps</h1><p>Android 1.0.2</p></section><section class="card"><h2>📥 Datos</h2><input id="file" type="file" accept=".xlsx,.xls,.csv"><div id="status">Importa Excel con TIPO, X, Y y NOMBRE.</div></section><section class="card"><h2>🔎 Destino</h2><input id="q" placeholder="Buscar por NOMBRE"><select id="sel"></select><div id="detail"></div><button id="maps" class="go" type="button">🗺️ ABRIR EN GOOGLE MAPS</button></section></main><script>
let rows=[];const $=s=>document.querySelector(s),key='riego_v102';function utm(e,n){const a=6378137,es=.0066943800229,k=.9996,x=e-500000,M=n/k,mu=M/(a*(1-es/4-3*es*es/64-5*es**3/256)),e1=(1-Math.sqrt(1-es))/(1+Math.sqrt(1-es)),p=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu),ep=es/(1-es),N=a/Math.sqrt(1-es*Math.sin(p)**2),T=Math.tan(p)**2,C=ep*Math.cos(p)**2,R=a*(1-es)/Math.pow(1-es*Math.sin(p)**2,1.5),D=x/(N*k);return{lat:(p-(N*Math.tan(p)/R)*(D*D/2-(5+3*T+10*C-4*C*C-9*ep)*D**4/24))*180/Math.PI,lon:-9+(D-(1+2*T+C)*D**3/6)/Math.cos(p)*180/Math.PI}}
function render(){let q=$('#q').value.toLowerCase(),r=rows.filter(x=>x.name.toLowerCase().includes(q));$('#sel').innerHTML=r.map(x=>`<option value="${rows.indexOf(x)}">${x.name} · ${x.type}</option>`).join('');pick()}function pick(){let r=rows[+$('#sel').value];if(!r){delete $('#maps').dataset.lat;delete $('#maps').dataset.lon;return}let g=utm(r.x,r.y);$('#detail').innerHTML=`<div class=item><b>${r.name}</b><br>${r.type}<br>GPS ${g.lat.toFixed(6)}, ${g.lon.toFixed(6)}</div>`;$('#maps').dataset.lat=g.lat;$('#maps').dataset.lon=g.lon}$('#maps').onclick=()=>{const lat=Number($('#maps').dataset.lat),lon=Number($('#maps').dataset.lon);if(!Number.isFinite(lat)||!Number.isFinite(lon)){alert('Selecciona primero un destino válido.');return}if(window.AndroidMaps&&typeof window.AndroidMaps.navigate==='function'){window.AndroidMaps.navigate(lat,lon)}else{window.location.href=`https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}&travelmode=driving`}};$('#q').oninput=render;$('#sel').onchange=pick;$('#file').onchange=async e=>{try{let f=e.target.files[0],wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});rows=raw.map(r=>({type:String(r.TIPO||''),x:+(r.X??r['COORDENADA X']),y:+(r.Y??r['COORDENADA Y']),name:String(r.NOMBRE||'')})).filter(r=>r.name&&isFinite(r.x)&&isFinite(r.y));localStorage.setItem(key,JSON.stringify(rows));$('#status').textContent=`${rows.length} elementos guardados`;render()}catch(e){$('#status').textContent='Error al leer Excel'}};try{rows=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}render();</script></body></html>
