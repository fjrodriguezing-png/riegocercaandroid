<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Regadío Baixa Limia</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f3f7fa;color:#142738}main{max-width:760px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#087f5b,#187bcd);padding:22px;border-radius:24px;color:#fff}.card{background:#fff;margin-top:14px;padding:17px;border-radius:20px;box-shadow:0 8px 25px #1232}button,input,select{width:100%;padding:14px;border-radius:13px;border:1px solid #dbe5ec;margin-top:9px;font:inherit}.go{background:#087f5b;color:#fff;font-weight:800}.dest-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.maps-small{width:auto;min-width:92px;padding:14px 12px;white-space:nowrap}.item{background:#f7fafc;padding:12px;border-radius:12px;margin-top:7px}@media(max-width:390px){.maps-small{min-width:78px;padding:14px 9px;font-size:13px}}.hero{position:relative}.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.hero-top h1{margin:0}.hero-top p{margin:7px 0 0}.menu-btn{touch-action:manipulation;cursor:pointer;position:relative;z-index:22;width:48px!important;height:48px;padding:11px!important;margin:0!important;border:1px solid rgba(255,255,255,.28)!important;background:rgba(255,255,255,.14)!important;border-radius:14px!important;display:flex;flex-direction:column;justify-content:center;gap:5px;flex:0 0 48px}.menu-btn span{width:24px;height:3px;border-radius:3px;background:#fff;display:block;margin:auto}.menu-panel{pointer-events:auto;position:absolute;right:18px;top:78px;z-index:20;width:min(250px,calc(100vw - 64px));padding:8px;background:#fff;color:#142738;border-radius:16px;box-shadow:0 16px 40px #0015}.menu-panel.hidden{display:none}.menu-panel button{margin:4px 0;background:#f4f8fa;color:#142738;text-align:left;font-weight:700}.menu-panel button:hover{background:#eaf3ef}@media(max-width:390px){.menu-btn{width:44px!important;height:44px;flex-basis:44px}.hero-top h1{font-size:25px}}.menu-section.hidden{display:none}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.section-head h2{margin:0}.section-close{width:42px!important;min-width:42px;height:42px;padding:0!important;margin:0!important;background:#eaf1f6!important;color:#234!important;font-weight:900}.menu-section{animation:sectionIn .18s ease}@keyframes sectionIn{from{opacity:.3;transform:translateY(-6px)}to{opacity:1;transform:none}}.near-hint,.near-status{color:#68798a;font-size:13px}.near-controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}.near-controls .compact{width:auto!important;min-width:86px}.near-result{text-align:left!important;background:#f7fafc!important;color:#142738!important;font-weight:600!important}.near-result small{display:block;color:#68798a;margin-top:3px}</style><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head><body><main><section class="hero"><div class="hero-top"><div><h1>Regadío Baixa Limia</h1><p>Android 1.0.2</p></div><button id="menuBtn" class="menu-btn" type="button" aria-label="Abrir menú" aria-expanded="false"><span></span><span></span><span></span></button></div><div id="menuPanel" class="menu-panel hidden"><button type="button" data-menu="destino">🔎 Destino</button><button type="button" data-menu="datos">📥 Importar datos</button><button type="button" data-menu="cerrar">✕ Cerrar menú</button></div></section><section class="card" id="cercanosCard"><h2>📍 Buscar cercanos</h2><p class="near-hint">Muestra los elementos de NOMBRE próximos a tu ubicación GPS.</p><label for="dist">Distancia máxima (metros)</label><div class="near-controls"><input id="dist" type="number" min="1" max="100000" value="50" inputmode="numeric"><button id="reset50" type="button" class="secondary compact">🎯 50 m</button></div><button id="nearbyBtn" type="button" class="go">📍 BUSCAR CERCANOS</button><div id="nearStatus" class="near-status"></div><div id="nearList"></div></section><section class="card menu-section hidden" id="datosCard"><div class="section-head"><h2>📥 Datos</h2><button type="button" class="section-close" data-close-section>✕</button></div><input id="file" type="file" accept=".xlsx,.xls,.csv"><div id="status">Importa Excel con TIPO, X, Y y NOMBRE.</div></section><section class="card menu-section hidden" id="destinoCard"><div class="section-head"><h2>🔎 Destino</h2><button type="button" class="section-close" data-close-section>✕</button></div><label for="q">Destino (Nombre)</label><div class="dest-row"><input id="q" placeholder="Introducir nombre"><button id="maps" class="go maps-small" type="button">🗺️ Maps</button></div><select id="sel"></select><div id="detail"></div></section></main><script>
const $=s=>document.querySelector(s);const menuBtn=$('#menuBtn'),menuPanel=$('#menuPanel');function closeMenu(){menuPanel.classList.add('hidden');menuBtn.setAttribute('aria-expanded','false')}menuBtn.onclick=(e)=>{e.stopPropagation();const open=menuPanel.classList.toggle('hidden')===false;menuBtn.setAttribute('aria-expanded',String(open))};menuPanel.onclick=(e)=>e.stopPropagation();document.addEventListener('click',(e)=>{if(!menuPanel.classList.contains('hidden')&&!menuPanel.contains(e.target)&&!menuBtn.contains(e.target))closeMenu()});function openSection(id){document.querySelectorAll('.menu-section').forEach(x=>x.classList.add('hidden'));const el=$(id);if(el){el.classList.remove('hidden');el.scrollIntoView({behavior:'smooth',block:'start'})}closeMenu()}document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>{const a=b.dataset.menu;if(a==='destino')openSection('#destinoCard');if(a==='datos')openSection('#datosCard');closeMenu()});document.querySelectorAll('[data-close-section]').forEach(b=>b.onclick=()=>b.closest('.menu-section').classList.add('hidden'));let rows=[],key='regadio_baixa_limia_v102';function utm(e,n){const a=6378137,es=.0066943800229,k=.9996,x=e-500000,M=n/k,mu=M/(a*(1-es/4-3*es*es/64)),e1=(1-Math.sqrt(1-es))/(1+Math.sqrt(1-es)),p=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu),ep=es/(1-es),N=a/Math.sqrt(1-es*Math.sin(p)**2),T=Math.tan(p)**2,C=ep*Math.cos(p)**2,R=a*(1-es)/Math.pow(1-es*Math.sin(p)**2,1.5),D=x/(N*k);return{lat:(p-(N*Math.tan(p)/R)*(D*D/2-(5+3*T+10*C-4*C*C-9*ep)*D**4/24))*180/Math.PI,lon:-9+(D-(1+2*T+C)*D**3/6)/Math.cos(p)*180/Math.PI}}
function render(){let q=$('#q').value.toLowerCase(),r=rows.filter(x=>x.name.toLowerCase().includes(q));$('#sel').innerHTML=r.map(x=>`<option value="${rows.indexOf(x)}">${x.name} · ${x.type}</option>`).join('');pick()}function pick(){let r=rows[+$('#sel').value];if(!r){delete $('#maps').dataset.lat;delete $('#maps').dataset.lon;return}let g=utm(r.x,r.y);$('#detail').innerHTML=`<div class=item><b>${r.name}</b><br>${r.type}<br>GPS ${g.lat.toFixed(6)}, ${g.lon.toFixed(6)}</div>`;$('#maps').dataset.lat=g.lat;$('#maps').dataset.lon=g.lon}$('#maps').onclick=()=>{let lat=Number($('#maps').dataset.lat),lon=Number($('#maps').dataset.lon);if(!Number.isFinite(lat)||!Number.isFinite(lon)){alert('Selecciona primero un destino válido.');return}if(window.AndroidMaps)window.AndroidMaps.navigate(lat,lon)};function hav(a,b,c,d){const R=6371000,t=x=>x*Math.PI/180,A=Math.sin(t(c-a)/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(t(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(A))}$('#reset50').onclick=()=>{$('#dist').value=50;if($('#nearList').children.length)nearby()};function nearby(){if(!rows.length){$('#nearStatus').textContent='Primero importa o carga los datos.';return}if(!navigator.geolocation){$('#nearStatus').textContent='El dispositivo no ofrece ubicación GPS.';return}$('#nearStatus').textContent='Obteniendo ubicación…';navigator.geolocation.getCurrentPosition(p=>{let max=Number($('#dist').value);if(!Number.isFinite(max)||max<1){max=50;$('#dist').value=50}max=Math.min(max,100000);const found=rows.map((r,i)=>{const g=utm(r.x,r.y);return{r,i,g,d:hav(p.coords.latitude,p.coords.longitude,g.lat,g.lon)}}).filter(x=>x.d<=max).sort((a,b)=>a.d-b.d).slice(0,20);$('#nearStatus').textContent=found.length?`${found.length} elemento(s) dentro de ${max} m · precisión GPS aprox. ${Math.round(p.coords.accuracy)} m`:`No hay elementos dentro de ${max} m.`;$('#nearList').innerHTML=found.map(x=>`<button type="button" class="near-result" data-near="${x.i}"><b>${x.r.name}</b><small>${Math.round(x.d)} m · ${x.r.type}</small></button>`).join('');document.querySelectorAll('[data-near]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.near),r=rows[i],g=utm(r.x,r.y);$('#q').value=r.name;render();$('#maps').dataset.lat=g.lat;$('#maps').dataset.lon=g.lon;openSection('#destinoCard')})},e=>{$('#nearStatus').textContent=e.code===1?'Permiso de ubicación denegado. Activa Ubicación precisa para la app.':'No se pudo obtener la ubicación. Activa el GPS e inténtalo de nuevo.'},{enableHighAccuracy:true,timeout:15000,maximumAge:15000})}$('#nearbyBtn').onclick=nearby;$('#q').oninput=render;$('#sel').onchange=pick;$('#file').onchange=async e=>{let f=e.target.files[0],wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});rows=raw.map(r=>({type:String(r.TIPO||''),x:+(r.X??r['COORDENADA X']),y:+(r.Y??r['COORDENADA Y']),name:String(r.NOMBRE||'')})).filter(r=>r.name&&isFinite(r.x)&&isFinite(r.y));localStorage.setItem(key,JSON.stringify(rows));$('#status').textContent=`${rows.length} elementos guardados`;render()};try{rows=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}render();</script></body></html>
