<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comunidad de Regantes Nova Limia</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#000;color:#142738}#bg{position:fixed;z-index:-10;inset:0;width:100vw;height:100vh;object-fit:cover;object-position:center}.splash{position:fixed;z-index:9999;inset:0;background:#000}.splash img{width:100%;height:100%;object-fit:cover;object-position:center}.splash-title{position:absolute;left:50%;top:50%;transform:translate(120%,-50%);opacity:0;width:90%;text-align:center;color:white;font-size:clamp(26px,7vw,42px);font-weight:900;text-shadow:0 3px 14px #000;animation:in .7s ease 1s forwards}@keyframes in{to{transform:translate(-50%,-50%);opacity:1}}.splash.out{opacity:0;visibility:hidden;transition:.3s}main{max-width:760px;margin:auto;padding:14px}.hero,.card{background:#ffffffeb;border-radius:22px;padding:18px;margin-top:14px}.hero{background:linear-gradient(135deg,#087f5bed,#187bcdea);color:white}.hero-top{display:flex;justify-content:space-between;gap:10px}.menu-btn{width:48px;height:48px;padding:10px}.menu-btn span{height:auto!important;background:transparent!important;display:block!important;margin:0!important;font-size:32px!important;line-height:1!important}.menu-panel{position:fixed;z-index:500;left:12px;right:12px;top:88px;max-width:760px;margin:auto;padding:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;background:#fffffff2;border-radius:22px}.menu-panel.hidden,.screen.hidden,#actions.hidden,#foundTitle.hidden,#openAll.hidden{display:none}.menu-panel button{aspect-ratio:1/1;border-radius:18px;font-weight:800}.menu-tile{display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff;padding:12px!important}.menu-tile img{display:block;width:78%;height:78%;object-fit:contain}.screen{background:#ffffffed;border-radius:22px;padding:18px;margin-top:14px}.row{display:grid;grid-template-columns:1fr auto;gap:8px}input,select,button{width:100%;padding:13px;margin-top:8px;border:1px solid #dbe5ec;border-radius:13px;font:inherit}.go{background:#087f5b;color:#fff;font-weight:800}.found button{text-align:left}.actions{position:fixed;z-index:1000;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;border-radius:22px;padding:16px;width:min(94%,520px);margin:12px}@media(min-width:620px){.menu-panel{grid-template-columns:repeat(3,minmax(0,1fr))}}#menuBtn{background:transparent!important;background-color:transparent!important;border:none!important;box-shadow:none!important;border-radius:0!important;margin:0!important;width:48px!important;height:48px!important;padding:10px!important}#menuBtn span{background:transparent!important}#menuBtn.menu-btn{background:transparent!important;background-color:transparent!important;border:0!important;box-shadow:none!important;outline:0!important;border-radius:0!important;width:48px!important;height:48px!important;min-width:48px!important;padding:0!important;margin:0!important;appearance:none!important;-webkit-appearance:none!important;color:inherit!important}#menuBtn.menu-btn span{display:flex!important;align-items:center!important;justify-content:center!important;width:48px!important;height:48px!important;margin:0!important;padding:0!important;background:transparent!important;border:0!important;box-shadow:none!important;font-size:32px!important;line-height:48px!important}</style><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head><body><img id="bg" src="splash_nova_limia.jpg" alt=""><div id="splash" class="splash"><img src="splash_nova_limia.jpg" alt=""><div class="splash-title">COMUNIDAD DE REGANTES<br>NOVA LIMIA</div></div><main><section class="hero"><div class="hero-top"><div><h1>Comunidad de Regantes Nova Limia</h1><p>Android 1.0.2</p></div><button id="menuBtn" class="menu-btn" type="button" aria-label="Abrir menú"><span>💧</span></button></div><div id="menu" class="menu-panel hidden"><button data-go="datos" class="menu-tile" aria-label="Importar datos" title="Importar datos"><img src="xlsx.jfif" alt="Importar datos"></button><button data-go="destino" class="menu-tile" aria-label="Destino" title="Destino"><img src="destino.png" alt="Destino"></button><button data-go="radio">🗺️ Elementos por radio</button><button id="earthMenu" class="menu-tile" aria-label="Google Earth" title="Google Earth"><img src="google earth.jfif" alt="Google Earth"></button><button id="closeMenu">✕ Cerrar menú</button></div></section><section id="datos" class="screen hidden"><h2>📥 Datos</h2><input id="file" type="file" accept=".xlsx,.xls,.csv"><div id="status">Importa Excel con TIPO, X, Y y NOMBRE.</div></section><section id="destino" class="screen hidden"><h2>🔎 Destino</h2><label>Destino (Nombre)</label><div class="row"><input id="q"><button id="maps" class="go">🗺️ Maps</button></div><select id="sel"></select><div id="detail"></div></section><section id="radio" class="screen hidden"><h2>🗺️ Elementos por radio</h2><label>Radio rápido</label><select id="radius"><option>10</option><option>25</option><option>50</option><option>100</option><option>250</option><option>500</option></select><label>Radio manual (metros)</label><input id="manual" type="number" min="1" max="100000" value="10"><button id="search" class="go">🔎 BUSCAR ELEMENTOS</button><div id="radioStatus"></div><h3 id="foundTitle" class="hidden">Elementos encontrados · de menor a mayor distancia</h3><ol id="found" class="found"></ol><button id="openAll" class="go hidden">🗺️ ABRIR EN GOOGLE MAPS</button></section></main><div id="actions" class="actions hidden"><div class="sheet"><h3 id="aname"></h3><div id="ameta"></div><button id="aMaps" class="go">🗺️ Abrir en Google Maps</button><button id="aEarth">🌍 Ver en Google Earth</button><button id="aWa">🟢 Denunciar incidencia por WhatsApp</button><button id="aCancel">Cancelar</button></div></div><script>const $=s=>document.querySelector(s);setTimeout(()=>$('#splash').classList.add('out'),3000);let rows=[],active=null,activeGps=null;const menu=$('#menu');$('#menuBtn').onclick=e=>{e.stopPropagation();menu.classList.toggle('hidden')};$('#closeMenu').onclick=()=>menu.classList.add('hidden');document.onclick=e=>{if(!menu.classList.contains('hidden')&&!menu.contains(e.target)&&e.target!==$('#menuBtn'))menu.classList.add('hidden')};document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.screen').forEach(x=>x.classList.add('hidden'));$('#'+b.dataset.go).classList.remove('hidden');menu.classList.add('hidden')});$('#earthMenu').onclick=()=>location.href='https://earth.google.com/web/';function utm(e,n){const a=6378137,es=.0066943800229,k=.9996,x=e-500000,M=n/k,mu=M/(a*(1-es/4-3*es*es/64)),e1=(1-Math.sqrt(1-es))/(1+Math.sqrt(1-es)),p=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu),ep=es/(1-es),N=a/Math.sqrt(1-es*Math.sin(p)**2),T=Math.tan(p)**2,C=ep*Math.cos(p)**2,R=a*(1-es)/Math.pow(1-es*Math.sin(p)**2,1.5),D=x/(N*k);return{lat:(p-(N*Math.tan(p)/R)*(D*D/2-(5+3*T+10*C-4*C*C-9*ep)*D**4/24))*180/Math.PI,lon:-9+(D-(1+2*T+C)*D**3/6)/Math.cos(p)*180/Math.PI}}function gps(r){return utm(+r.x,+r.y)}function hav(a,b,c,d){const R=6371000,t=x=>x*Math.PI/180,A=Math.sin(t(c-a)/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(t(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(A))}function render(){let q=$('#q').value.toLowerCase(),rr=rows.filter(x=>x.name.toLowerCase().includes(q));$('#sel').innerHTML=rr.map(x=>`<option value="${rows.indexOf(x)}">${x.name} · ${x.type}</option>`).join('');pick()}function pick(){let r=rows[+$('#sel').value];if(!r)return;let g=gps(r);$('#detail').textContent=`${r.name} · ${r.type} · GPS ${g.lat.toFixed(6)}, ${g.lon.toFixed(6)}`;$('#maps').dataset.lat=g.lat;$('#maps').dataset.lon=g.lon}$('#q').oninput=render;$('#sel').onchange=pick;$('#maps').onclick=()=>window.AndroidMaps&&window.AndroidMaps.navigate(+$('#maps').dataset.lat,+$('#maps').dataset.lon);$('#radius').onchange=()=>$('#manual').value=$('#radius').value;$('#search').onclick=()=>{if(!rows.length){$('#radioStatus').textContent='Primero importa los datos.';return}navigator.geolocation.getCurrentPosition(p=>{let r=Math.max(1,Math.min(100000,+$('#manual').value||10)),f=rows.map((x,i)=>{let g=gps(x);return{x,i,g,d:hav(p.coords.latitude,p.coords.longitude,g.lat,g.lon)}}).filter(x=>x.d<=r).sort((a,b)=>a.d-b.d);$('#radioStatus').textContent=`${f.length} elemento(s) dentro de ${r} m`;$('#foundTitle').classList.toggle('hidden',!f.length);$('#found').innerHTML=f.slice(0,50).map(x=>`<li><button data-i="${x.i}" data-d="${x.d}"><b>${x.x.name}</b><br><small>${x.d<10?x.d.toFixed(1):Math.round(x.d)} m · ${x.x.type}</small></button></li>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>openActions(+b.dataset.i,+b.dataset.d));$('#openAll').classList.toggle('hidden',!f.length)},{enableHighAccuracy:true,timeout:20000,maximumAge:0})};function openActions(i,d){active=rows[i];activeGps=gps(active);$('#aname').textContent=active.name;$('#ameta').textContent=`${active.type} · ${d<10?d.toFixed(1):Math.round(d)} m`;$('#actions').classList.remove('hidden')}$('#aCancel').onclick=()=>$('#actions').classList.add('hidden');$('#aMaps').onclick=()=>window.AndroidMaps.navigate(activeGps.lat,activeGps.lon);$('#aEarth').onclick=()=>location.href=`https://earth.google.com/web/search/${activeGps.lat},${activeGps.lon}`;$('#aWa').onclick=()=>{let map=`https://www.google.com/maps/search/?api=1&query=${activeGps.lat},${activeGps.lon}`,text=`INCIDENCIA - ${active.name}\nTipo: ${active.type||'Sin tipo'}\nSe ha detectado una incidencia en este elemento. Gracias.\n\nUbicación Google Maps:\n${map}`;location.href=`https://wa.me/34615179537?text=${encodeURIComponent(text)}`};$('#file').onchange=async e=>{let f=e.target.files[0],wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});rows=raw.map(r=>({type:String(r.TIPO||''),x:+(r.X??r['COORDENADA X']),y:+(r.Y??r['COORDENADA Y']),name:String(r.NOMBRE||'')})).filter(r=>r.name&&isFinite(r.x)&&isFinite(r.y));localStorage.setItem('crnl_rows',JSON.stringify(rows));$('#status').textContent=`${rows.length} elementos guardados`;render()};try{rows=JSON.parse(localStorage.getItem('crnl_rows')||'[]')}catch(e){}render();</script></body></html>
