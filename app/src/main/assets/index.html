<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Riego Cerca</title><style>:root{--g:#087f5b;--b:#187bcd;--bg:#f3f7fa;--t:#142738}*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:var(--bg);color:var(--t)}main{max-width:760px;margin:auto;padding:14px 14px 80px}.hero{background:linear-gradient(135deg,var(--g),var(--b));padding:22px;border-radius:24px;color:white}.hero img{width:64px;border-radius:16px}.card{background:white;margin-top:14px;padding:17px;border-radius:20px;box-shadow:0 8px 25px #1232}button,input,select,a{width:100%;padding:14px;border-radius:13px;border:1px solid #dbe5ec;margin-top:9px;font:inherit}button,.go{background:var(--g);color:white;font-weight:800;text-align:center;text-decoration:none;display:block}.secondary{background:#eaf1f6;color:#234}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{background:#f7fafc;padding:12px;border-radius:12px;margin-top:7px}.muted{color:#68798a;font-size:13px}.hidden{display:none}</style><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head><body><main><section class="hero"><img src="riego_cerca_icon.png"><h1>Riego Cerca · Maps</h1><p>Localiza elementos, descubre los más cercanos y navega con Google Maps.</p></section><section class="card"><h2>⚡ Accesos rápidos</h2><div class="row"><button onclick="nearby()">📍 Cerca de mí</button><button onclick="document.querySelector('#q').focus()">🔎 Buscar</button></div></section><section class="card"><h2>📥 Datos</h2><input id="file" type="file" accept=".xlsx,.xls,.csv"><button class="secondary" onclick="restore()">↩ Restaurar datos guardados</button><div id="status" class="muted">Importa tu Excel con TIPO, X, Y y NOMBRE. La última importación queda guardada.</div></section><section class="card"><h2>🔎 Elegir destino</h2><input id="q" placeholder="Buscar por NOMBRE"><select id="sel"></select><div id="detail"></div><a id="maps" class="go">🗺️ ABRIR EN GOOGLE MAPS</a></section><section class="card"><h2>📍 Elementos cercanos</h2><label>Distancia máxima (metros)</label><input id="dist" type="number" value="50" min="1"><button onclick="document.querySelector('#dist').value=50">🎯 Restablecer a 50 m</button><div id="list"></div></section></main><script>
let rows=[];const $=s=>document.querySelector(s),key='riego_rows_v1';function utm(e,n){const a=6378137,es=.0066943800229,k=.9996,x=e-500000,M=n/k,mu=M/(a*(1-es/4-3*es*es/64-5*es**3/256)),e1=(1-Math.sqrt(1-es))/(1+Math.sqrt(1-es)),p=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu)+(151*e1**3/96)*Math.sin(6*mu),ep=es/(1-es),N=a/Math.sqrt(1-es*Math.sin(p)**2),T=Math.tan(p)**2,C=ep*Math.cos(p)**2,R=a*(1-es)/Math.pow(1-es*Math.sin(p)**2,1.5),D=x/(N*k);let lat=p-(N*Math.tan(p)/R)*(D*D/2-(5+3*T+10*C-4*C*C-9*ep)*D**4/24),lon=-9+(D-(1+2*T+C)*D**3/6)/Math.cos(p)*180/Math.PI;return{lat:lat*180/Math.PI,lon}}
function render(){let q=$('#q').value.toLowerCase(),r=rows.filter(x=>x.name.toLowerCase().includes(q));$('#sel').innerHTML=r.map((x,i)=>`<option value="${rows.indexOf(x)}">${x.name} · ${x.type}</option>`).join('');pick()}function pick(){let r=rows[+$('#sel').value];if(!r)return;let g=utm(r.x,r.y);$('#detail').innerHTML=`<div class=item><b>${r.name}</b><br><span class=muted>${r.type}<br>X ${r.x} · Y ${r.y}</span></div>`;$('#maps').href=`https://www.google.com/maps/dir/?api=1&destination=${g.lat},${g.lon}&travelmode=driving`}
$('#q').oninput=render;$('#sel').onchange=pick;$('#file').onchange=async e=>{let f=e.target.files[0],wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});rows=raw.map(r=>({type:String(r.TIPO||''),x:+(r.X??r['COORDENADA X']),y:+(r.Y??r['COORDENADA Y']),name:String(r.NOMBRE||'')})).filter(r=>r.name&&isFinite(r.x)&&isFinite(r.y));localStorage.setItem(key,JSON.stringify(rows));$('#status').textContent=`${rows.length} elementos importados y guardados`;render()};function restore(){let x=localStorage.getItem(key);rows=x?JSON.parse(x):[];render();$('#status').textContent=rows.length?`${rows.length} elementos guardados cargados`:'No hay datos guardados'}function hav(a,b,c,d){let R=6371000,t=x=>x*Math.PI/180,A=Math.sin(t(c-a)/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(t(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(A))}function nearby(){navigator.geolocation.getCurrentPosition(p=>{let max=+$('#dist').value||50,res=rows.map((r,i)=>{let g=utm(r.x,r.y);return{r,i,d:hav(p.coords.latitude,p.coords.longitude,g.lat,g.lon)}}).filter(x=>x.d<=max).sort((a,b)=>a.d-b.d).slice(0,20);$('#list').innerHTML=res.length?res.map(x=>`<button class=item onclick="$('#sel').value=${x.i};pick()"><b>${x.r.name}</b><br>${Math.round(x.d)} m · ${x.r.type}</button>`).join(''):'<p>No hay elementos dentro del radio.</p>'},()=>alert('Activa y autoriza la ubicación precisa.'),{enableHighAccuracy:true,timeout:15000})}restore();</script></body></html>
