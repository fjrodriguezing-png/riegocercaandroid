<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comunidad de Regantes Nova Limia</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f3f7fa url('fondo_app.png') left center/cover fixed no-repeat;color:#142738;min-height:100vh}body:before{content:'';position:fixed;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(244,247,250,.48));pointer-events:none;z-index:-1}main{max-width:760px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,rgba(8,127,91,.93),rgba(24,123,205,.90));padding:22px;border-radius:24px;color:#fff}.card{background:rgba(255,255,255,.92);backdrop-filter:blur(3px);margin-top:14px;padding:17px;border-radius:20px;box-shadow:0 8px 25px #1232}button,input,select{width:100%;padding:14px;border-radius:13px;border:1px solid #dbe5ec;margin-top:9px;font:inherit}.go{background:#087f5b;color:#fff;font-weight:800}.dest-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.maps-small{width:auto;min-width:92px;padding:14px 12px;white-space:nowrap}.item{background:#f7fafc;padding:12px;border-radius:12px;margin-top:7px}@media(max-width:390px){.maps-small{min-width:78px;padding:14px 9px;font-size:13px}}.hero{position:relative}.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.hero-top h1{margin:0}.hero-top p{margin:7px 0 0}.menu-btn{touch-action:manipulation;cursor:pointer;position:relative;z-index:22;width:48px!important;height:48px;padding:11px!important;margin:0!important;border:1px solid rgba(255,255,255,.28)!important;background:rgba(255,255,255,.14)!important;border-radius:14px!important;display:flex;flex-direction:column;justify-content:center;gap:5px;flex:0 0 48px}.menu-btn span{width:24px;height:3px;border-radius:3px;background:#fff;display:block;margin:auto}.menu-panel{pointer-events:auto;position:absolute;right:18px;top:78px;z-index:20;width:min(250px,calc(100vw - 64px));padding:8px;background:#fff;color:#142738;border-radius:16px;box-shadow:0 16px 40px #0015}.menu-panel.hidden{display:none}.menu-panel button{margin:4px 0;background:#f4f8fa;color:#142738;text-align:left;font-weight:700}.menu-panel button:hover{background:#eaf3ef}@media(max-width:390px){.menu-btn{width:44px!important;height:44px;flex-basis:44px}.hero-top h1{font-size:25px}}.menu-section.hidden{display:none}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.section-head h2{margin:0}.section-close{width:42px!important;min-width:42px;height:42px;padding:0!important;margin:0!important;background:#eaf1f6!important;color:#234!important;font-weight:900}.menu-section{animation:sectionIn .18s ease}@keyframes sectionIn{from{opacity:.3;transform:translateY(-6px)}to{opacity:1;transform:none}}.near-hint,.near-status{color:#68798a;font-size:13px}.near-controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}.near-controls .compact{width:auto!important;min-width:86px}.near-result{text-align:left!important;background:#f7fafc!important;color:#142738!important;font-weight:600!important}.near-result small{display:block;color:#68798a;margin-top:3px}.maps-found-list{margin:10px 0 0;padding-left:28px}.maps-found-list li{background:#f7fafc;color:#142738;border:1px solid #dbe5ec;padding:11px 12px;margin:7px 0;border-radius:12px}.maps-found-list b{display:block}.maps-found-list small{display:block;color:#68798a;margin-top:3px}#mapsFoundTitle{margin:16px 0 6px;font-size:15px}#mapsFoundTitle.hidden,#mapsFoundOpen.hidden{display:none}@media(max-width:600px){body{background-position:left center;background-size:auto 100%;background-color:#eef4f1}.card{background:rgba(255,255,255,.94)}}.menu-section.active-view{display:block!important;margin-top:14px}.top-actions{display:flex;align-items:center;gap:7px;flex:0 0 auto}.home-btn{width:54px!important;height:48px!important;min-width:54px;padding:4px!important;margin:0!important;border:1px solid rgba(255,255,255,.28)!important;background:rgba(255,255,255,.14)!important;color:#fff!important;border-radius:14px!important;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px;line-height:18px;font-weight:800;touch-action:manipulation}.home-btn small{font-size:9px;line-height:10px;margin-top:2px;color:#fff}@media(max-width:390px){.home-btn{width:49px!important;min-width:49px;height:44px!important}}</style><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js">window.addEventListener('error',e=>{const el=$('#maps10Status');if(el)el.textContent='Error de la aplicación: '+e.message});</script></head><body><main><section class="hero"><div class="hero-top"><div><h1>Comunidad de Regantes Nova Limia</h1><p>Android 1.0.2</p></div><button id="menuBtn" class="menu-btn" type="button" aria-label="Abrir menú" aria-expanded="false"><span></span><span></span><span></span></button></div></div><div id="menuPanel" class="menu-panel hidden"><button type="button" data-menu="datos">📥 Importar datos</button><button type="button" data-menu="destino">🔎 Destino</button><button type="button" id="maps10Menu">🗺️ Elementos por radio</button><button type="button" data-menu="cerrar">✕ Cerrar menú</button></div></section><section class="card menu-section hidden" id="maps10Card"><div class="section-head"><h2>🗺️ Elementos por radio</h2><button type="button" class="section-close" data-close-section>✕</button></div><label for="mapsRadius">Radio rápido</label><select id="mapsRadius"><option value="10" selected>10 metros</option><option value="25">25 metros</option><option value="50">50 metros</option><option value="100">100 metros</option><option value="250">250 metros</option><option value="500">500 metros</option></select><label for="mapsRadiusManual">Radio manual (metros)</label><input id="mapsRadiusManual" type="number" min="1" max="100000" value="10" inputmode="numeric" placeholder="Ejemplo: 75"><button id="mapsRadiusSearch" type="button" class="go">🔎 BUSCAR ELEMENTOS</button><div id="maps10Status">Indica el radio y pulsa Buscar elementos.</div><h3 id="mapsFoundTitle" class="hidden">Elementos encontrados · de menor a mayor distancia</h3><ol id="mapsFoundList" class="maps-found-list"></ol><button id="mapsFoundOpen" type="button" class="go hidden">🗺️ ABRIR EN GOOGLE MAPS</button></section><section class="card menu-section hidden" id="datosCard"><div class="section-head"><h2>📥 Datos</h2><button type="button" class="section-close" data-close-section>✕</button></div><input id="file" type="file" accept=".xlsx,.xls,.csv"><div id="status">Importa Excel con TIPO, X, Y y NOMBRE.</div></section><section class="card menu-section hidden" id="destinoCard"><div class="section-head"><h2>🔎 Destino</h2><button type="button" class="section-close" data-close-section>✕</button></div><label for="q">Destino (Nombre)</label><div class="dest-row"><input id="q" placeholder="Introducir nombre"><button id="maps" class="go maps-small" type="button">🗺️ Maps</button></div><select id="sel"></select><div id="detail"></div></section></main><script>
const $=s=>document.querySelector(s);const menuBtn=$('#menuBtn'),menuPanel=$('#menuPanel');function closeMenu(){menuPanel.classList.add('hidden');menuBtn.setAttribute('aria-expanded','false')}menuBtn.onclick=(e)=>{e.stopPropagation();const open=menuPanel.classList.toggle('hidden')===false;menuBtn.setAttribute('aria-expanded',String(open))};menuPanel.onclick=(e)=>e.stopPropagation();document.addEventListener('click',(e)=>{if(!menuPanel.classList.contains('hidden')&&!menuPanel.contains(e.target)&&!menuBtn.contains(e.target))closeMenu()});function showHome(){document.body.classList.remove('menu-mode');document.querySelectorAll('.menu-section').forEach(x=>{x.classList.add('hidden');x.classList.remove('active-view')});window.scrollTo({top:0,behavior:'smooth'});closeMenu()}function openSection(id){document.body.classList.add('menu-mode');document.querySelectorAll('.menu-section').forEach(x=>{x.classList.add('hidden');x.classList.remove('active-view')});const el=$(id);if(el){el.classList.remove('hidden');el.classList.add('active-view');el.scrollIntoView({behavior:'smooth',block:'start'})}closeMenu()}document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>{const a=b.dataset.menu;if(a==='destino')openSection('#destinoCard');if(a==='datos')openSection('#datosCard');closeMenu()});document.querySelectorAll('[data-close-section]').forEach(b=>b.onclick=showHome);let rows=[],key='regadio_baixa_limia_v102';function utm(e,n){const a=6378137,es=.0066943800229,k=.9996,x=e-500000,M=n/k,mu=M/(a*(1-es/4-3*es*es/64)),e1=(1-Math.sqrt(1-es))/(1+Math.sqrt(1-es)),p=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu),ep=es/(1-es),N=a/Math.sqrt(1-es*Math.sin(p)**2),T=Math.tan(p)**2,C=ep*Math.cos(p)**2,R=a*(1-es)/Math.pow(1-es*Math.sin(p)**2,1.5),D=x/(N*k);return{lat:(p-(N*Math.tan(p)/R)*(D*D/2-(5+3*T+10*C-4*C*C-9*ep)*D**4/24))*180/Math.PI,lon:-9+(D-(1+2*T+C)*D**3/6)/Math.cos(p)*180/Math.PI}}
function render(){let q=$('#q').value.toLowerCase(),r=rows.filter(x=>x.name.toLowerCase().includes(q));$('#sel').innerHTML=r.map(x=>`<option value="${rows.indexOf(x)}">${x.name} · ${x.type}</option>`).join('');pick()}function pick(){let r=rows[+$('#sel').value];if(!r){delete $('#maps').dataset.lat;delete $('#maps').dataset.lon;return}let g=utm(r.x,r.y);$('#detail').innerHTML=`<div class=item><b>${r.name}</b><br>${r.type}<br>GPS ${g.lat.toFixed(6)}, ${g.lon.toFixed(6)}</div>`;$('#maps').dataset.lat=g.lat;$('#maps').dataset.lon=g.lon}$('#maps').onclick=()=>{let lat=Number($('#maps').dataset.lat),lon=Number($('#maps').dataset.lon);if(!Number.isFinite(lat)||!Number.isFinite(lon)){alert('Selecciona primero un destino válido.');return}if(window.AndroidMaps)window.AndroidMaps.navigate(lat,lon)};function hav(lat1,lon1,lat2,lon2){const R=6371000,toRad=v=>v*Math.PI/180,dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1),a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
function gpsForRow(r){const x=Number(r.x),y=Number(r.y);if(!Number.isFinite(x)||!Number.isFinite(y))return null;if(x>=100000&&x<=900000&&y>=0&&y<=10000000)return utm(x,y);if(Math.abs(y)<=90&&Math.abs(x)<=180)return{lat:y,lon:x};if(Math.abs(x)<=90&&Math.abs(y)<=180)return{lat:x,lon:y};return null}
function getGps(statusEl,onSuccess){const status=$(statusEl);if(!navigator.geolocation){status.textContent='Este dispositivo no ofrece ubicación GPS.';return}status.textContent='Solicitando ubicación GPS precisa…';navigator.geolocation.getCurrentPosition(pos=>{const lat=Number(pos.coords.latitude),lon=Number(pos.coords.longitude);if(!Number.isFinite(lat)||!Number.isFinite(lon)){status.textContent='El GPS devolvió una posición no válida.';return}onSuccess({lat,lon,accuracy:Number(pos.coords.accuracy)||0})},err=>{let msg='No se pudo obtener la ubicación.';if(err&&err.code===1)msg='Permiso de ubicación denegado. Actívalo en Ajustes > Aplicaciones > Comunidad de Regantes Nova Limia > Permisos > Ubicación.';else if(err&&err.code===2)msg='Ubicación no disponible. Activa el GPS y prueba al aire libre.';else if(err&&err.code===3)msg='El GPS tardó demasiado. Vuelve a intentarlo.';status.textContent=msg},{enableHighAccuracy:true,timeout:20000,maximumAge:0})}
function rankedWithinRadius(pos,radius){return rows.map((r,i)=>{const g=gpsForRow(r);if(!g||!Number.isFinite(g.lat)||!Number.isFinite(g.lon))return null;const d=hav(pos.lat,pos.lon,g.lat,g.lon);return Number.isFinite(d)?{r,i,g,d}:null}).filter(Boolean).filter(x=>x.d<=radius).sort((a,b)=>a.d-b.d)}
function selectedMapsRadius(){let radius=Number($('#mapsRadiusManual').value);if(!Number.isFinite(radius)||radius<1){radius=10;$('#mapsRadiusManual').value='10'}return Math.min(radius,100000)}
let mapsFoundPoints=[];
function resetRadiusResults(){mapsFoundPoints=[];$('#mapsFoundOpen').classList.add('hidden');$('#mapsFoundTitle').classList.add('hidden');$('#mapsFoundList').innerHTML=''}
function findWithinRadius(){const radius=selectedMapsRadius();resetRadiusResults();if(!rows.length){$('#maps10Status').textContent='No hay datos cargados. Importa el Excel desde el menú Datos.';return}$('#mapsRadiusSearch').disabled=true;$('#mapsRadiusSearch').textContent='BUSCANDO…';getGps('#maps10Status',pos=>{try{const found=rankedWithinRadius(pos,radius);$('#mapsRadiusSearch').disabled=false;$('#mapsRadiusSearch').textContent='🔎 BUSCAR ELEMENTOS';if(!found.length){$('#maps10Status').textContent=`No hay elementos de NOMBRE dentro de ${radius} m. Precisión GPS aprox. ${Math.round(pos.accuracy)} m.`;return}mapsFoundPoints=found.slice(0,10).map(x=>`${x.g.lat},${x.g.lon}`);$('#maps10Status').textContent=`Encontrados ${found.length} elemento(s) dentro de ${radius} m · precisión GPS aprox. ${Math.round(pos.accuracy)} m.`;$('#mapsFoundTitle').classList.remove('hidden');$('#mapsFoundList').innerHTML=found.slice(0,50).map(x=>`<li><b>${x.r.name}</b><small>Distancia: ${x.d<10?x.d.toFixed(1):Math.round(x.d)} m · ${x.r.type||'Sin tipo'}</small></li>`).join('')+(found.length>50?`<li><b>… y ${found.length-50} elemento(s) más</b></li>`:'');$('#mapsFoundOpen').classList.remove('hidden');$('#mapsFoundTitle').scrollIntoView({behavior:'smooth',block:'nearest'})}catch(e){$('#mapsRadiusSearch').disabled=false;$('#mapsRadiusSearch').textContent='🔎 BUSCAR ELEMENTOS';$('#maps10Status').textContent='Error al calcular elementos por radio: '+e.message}})}
function openFoundInMaps(){if(!mapsFoundPoints.length){$('#maps10Status').textContent='Primero pulsa Buscar elementos.';return}if(window.AndroidMaps&&typeof window.AndroidMaps.openMulti==='function')window.AndroidMaps.openMulti(JSON.stringify(mapsFoundPoints));else{const dest=encodeURIComponent(mapsFoundPoints[mapsFoundPoints.length-1]),wp=mapsFoundPoints.slice(0,-1).map(encodeURIComponent).join('%7C');let url=`https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=driving`;if(wp)url+=`&waypoints=${wp}`;window.location.href=url}}
$('#maps10Menu').onclick=()=>{closeMenu();openSection('#maps10Card')};

$('#mapsRadius').onchange=()=>{$('#mapsRadiusManual').value=$('#mapsRadius').value;resetRadiusResults();$('#maps10Status').textContent='Radio cambiado. Pulsa Buscar elementos.'};
$('#mapsRadiusManual').oninput=()=>{resetRadiusResults();$('#maps10Status').textContent='Radio manual cambiado. Pulsa Buscar elementos.'};
$('#mapsRadiusSearch').onclick=findWithinRadius;
$('#mapsFoundOpen').onclick=openFoundInMaps;
$('#q').oninput=render;$('#sel').onchange=pick;$('#file').onchange=async e=>{let f=e.target.files[0],wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});rows=raw.map(r=>({type:String(r.TIPO||''),x:+(r.X??r['COORDENADA X']),y:+(r.Y??r['COORDENADA Y']),name:String(r.NOMBRE||'')})).filter(r=>r.name&&isFinite(r.x)&&isFinite(r.y));localStorage.setItem(key,JSON.stringify(rows));$('#status').textContent=`${rows.length} elementos guardados`;render()};try{rows=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}render();</script></body></html>
